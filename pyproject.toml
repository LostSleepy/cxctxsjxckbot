[project]
name = "teto-bot"
version = "2.0.0"
description = "Teto — bot multifuncional de Discord (discord.py 2.x)"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.3.2,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "flask>=3.0.3,<4.0.0",
  "pytz>=2024.1",
  "groq>=0.12.0,<1.0.0",
  "aiohttp>=3.9.5,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
